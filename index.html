<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>SmartStudy - Menyu va Tillar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-10 font-sans select-none">

    <!-- Yuqori panel -->
    <header class="bg-slate-900/90 backdrop-blur-md sticky top-0 z-20 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <!-- Uchta chiziq (Burger menyu tugmasi) -->
            <button onclick="toggleMenu()" class="text-slate-300 hover:text-white p-1.5 focus:outline-none active:scale-95 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div>
                <h1 class="text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                    SmartStudy
                </h1>
                <p id="todayInfo" class="text-[11px] text-slate-400">Yuklanmoqda...</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleHemisModal()" class="bg-blue-600/20 text-blue-300 border border-blue-500/40 text-xs font-semibold px-2.5 py-1.5 rounded-full active:scale-95 transition">
                🎓 HEMIS
            </button>
            <button onclick="initAudioEngine()" id="audioStatusBtn" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-semibold px-2.5 py-1.5 rounded-full active:scale-95 transition">
                🔇
            </button>
        </div>
    </header>

    <!-- Yon menyu (Drawer / Parda) -->
    <div id="sideMenu" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity duration-300">
        <div class="absolute left-0 top-0 bottom-0 w-72 bg-slate-900 border-r border-slate-800 p-5 flex flex-col justify-between shadow-2xl">
            <div class="space-y-6">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider">Sozlamalar</h2>
                    <button onclick="toggleMenu()" class="text-slate-400 hover:text-white text-base px-2 py-1">✕</button>
                </div>

                <!-- Tillar bo'limi -->
                <div class="space-y-2">
                    <label id="t-menu-lang" class="text-xs text-slate-400 font-semibold block">Tilni tanlang / Язык / Language:</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setLanguage('uz'); toggleMenu();" id="m-lang-uz" class="py-2 rounded-xl text-xs font-bold border transition">UZ</button>
                        <button onclick="setLanguage('ru'); toggleMenu();" id="m-lang-ru" class="py-2 rounded-xl text-xs font-bold border transition">RU</button>
                        <button onclick="setLanguage('en'); toggleMenu();" id="m-lang-en" class="py-2 rounded-xl text-xs font-bold border transition">EN</button>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-3 text-center">
                <p class="text-[10px] text-slate-500">SmartStudy PWA v2.5</p>
            </div>
        </div>
        <div class="absolute inset-0 -z-10" onclick="toggleMenu()"></div>
    </div>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

        <!-- HEMIS Sozlamalar Paneli -->
        <div id="hemisCard" class="hidden bg-slate-900 border border-blue-500/40 rounded-2xl p-4 space-y-3 shadow-xl">
            <div class="flex justify-between items-center">
                <span id="t-hemis-title" class="text-xs font-bold text-blue-400 uppercase">🎓 HEMIS Profilga Kirish</span>
                <button onclick="toggleHemisModal()" id="t-close" class="text-slate-400 hover:text-white text-xs px-2 py-1">✕ Yopish</button>
            </div>
            
            <div class="space-y-2.5">
                <div>
                    <label id="t-hemis-domain-lbl" class="text-[10px] text-slate-400 block mb-1">Universitet HEMIS manzili</label>
                    <input type="text" id="hemisDomain" placeholder="student.samdu.uz" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label id="t-hemis-login-lbl" class="text-[10px] text-slate-400 block mb-1">Talaba ID (Login)</label>
                    <input type="text" id="hemisLogin" placeholder="39221110045" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label id="t-hemis-pass-lbl" class="text-[10px] text-slate-400 block mb-1">Parol</label>
                    <div class="relative flex items-center">
                        <input type="password" id="hemisPass" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-3 pr-10 py-2.5 text-xs text-white focus:border-blue-500 outline-none">
                        <button type="button" onclick="togglePasswordVisibility()" id="eyeBtn" class="absolute right-3 text-base select-none">
                            👁️
                        </button>
                    </div>
                </div>

                <p id="hemisStatusMsg" class="text-[11px] text-amber-300 hidden"></p>

                <button onclick="connectHemis()" id="hemisConnectBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
                    Kirish va jadvalni yuklash
                </button>
            </div>
        </div>

        <!-- Hafta kunlari tablari -->
        <div class="flex gap-2 overflow-x-auto py-1" id="daysTabs"></div>

        <!-- Ovozli o'qish va Bittalab o'tish paneli -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-2xl p-4 shadow-lg space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <h2 id="selectedDayTitle" class="text-lg font-bold text-white">Jadval</h2>
                    <p id="dayStats" class="text-xs text-emerald-100">0 ta dars</p>
                </div>
                <button onclick="startStepByStepReading()" id="t-read-start" class="bg-white text-emerald-800 font-bold text-xs px-4 py-3 rounded-xl shadow active:scale-95 transition">
                    🔊 Boshidan o'qish
                </button>
            </div>
            
            <div id="readingControlPanel" class="hidden bg-emerald-950/70 border border-emerald-300/40 rounded-xl p-3 flex items-center justify-between gap-2">
                <div class="flex-1">
                    <span id="t-reading-now" class="text-[10px] uppercase font-bold text-emerald-300 block">Hozir o'qilmoqda:</span>
                    <p id="currentReadingText" class="text-xs font-semibold text-white">...</p>
                </div>
                <button onclick="nextStepLesson()" id="t-next-btn" class="bg-amber-400 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-lg shadow active:scale-95 transition flex-shrink-0">
                    Keyingisi ➡️
                </button>
            </div>
        </div>

        <!-- Pomodoro Taymer -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <div class="flex justify-between items-center mb-2">
                <span id="t-timer-title" class="text-xs font-semibold text-blue-400">⏱ Real vaqt taymeri</span>
                <div class="flex gap-1.5">
                    <button onclick="setTimer(25)" class="text-[11px] bg-slate-800 px-2.5 py-1 rounded-md text-slate-300">25m</button>
                    <button onclick="setTimer(5)" class="text-[11px] bg-slate-800 px-2.5 py-1 rounded-md text-slate-300">5m</button>
                </div>
            </div>
            <div class="flex items-center justify-between mt-3">
                <div>
                    <div id="timerDisplay" class="text-4xl font-mono font-bold text-white tracking-wider">25:00</div>
                    <p id="activeSubject" class="text-[11px] text-slate-400">Taymer to'xtatilgan</p>
                </div>
                <div class="flex gap-2">
                    <button id="startBtn" onclick="toggleTimer()" class="bg-blue-600 text-white font-bold text-sm px-5 py-3 rounded-xl">Boshlash</button>
                    <button onclick="resetTimer()" class="bg-slate-800 text-slate-300 text-sm px-3.5 py-3 rounded-xl">↺</button>
                </div>
            </div>
        </div>

        <!-- Dars qo'shish -->
        <form id="addLessonForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <p id="t-add-title" class="text-xs font-bold text-slate-300 uppercase">+ Qo'lda dars qo'shish</p>
            <div class="grid grid-cols-3 gap-2">
                <input type="time" id="lessonTime" required class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                <input type="text" id="lessonName" required placeholder="Fan nomi..." class="col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <button type="submit" id="t-save-btn" class="w-full bg-slate-800 text-emerald-400 font-bold py-2.5 rounded-xl text-sm border border-slate-700">Saqlash</button>
        </form>

        <!-- Darslar ro'yxati -->
        <div class="space-y-2.5" id="lessonsContainer"></div>

    </main>

        let currentLang = localStorage.getItem('smartstudy_lang') || 'uz';
        const todayObj = new Date();
        const realTodayId = todayObj.getDay();
        let selectedDayId = realTodayId;
        let audioActive = false;
        let lastCheckedMinute = "";

        let currentReadingIndex = 0;
        let activeReadingList = [];

        let weeklyData = JSON.parse(localStorage.getItem('offlineStudyData')) || {
            1: [{ time: "08:30", name: "Oliy matematika", done: false }],
            2: [], 3: [], 4: [], 5: [], 6: [], 0: []
        };

        if (localStorage.getItem('hemis_domain')) {
            document.getElementById('hemisDomain').value = localStorage.getItem('hemis_domain');
            document.getElementById('hemisLogin').value = localStorage.getItem('hemis_user') || '';
        }

        // Menyuni ochib-yopish
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('hidden');
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('smartstudy_lang', lang);
            stopReadingPanel();
            applyLanguage();
        }

        function applyLanguage() {
            const t = translations[currentLang];

            // Menyu ichidagi til tugmalarini bo'yash
            ['uz', 'ru', 'en'].forEach(l => {
                const btn = document.getElementById(`m-lang-${l}`);
                if (l === currentLang) {
                    btn.className = "py-2 rounded-xl text-xs font-bold bg-blue-600 text-white border border-blue-500 shadow transition";
                } else {
                    btn.className = "py-2 rounded-xl text-xs font-bold bg-slate-950 text-slate-400 border border-slate-800 hover:text-white transition";
                }
            });

            document.getElementById('t-menu-lang').innerText = t.menuLang;
            const todayObjLang = t.days.find(d => d.id === realTodayId);
            document.getElementById('todayInfo').innerText = `${t.todayPrefix}: ${todayObjLang.full}`;
            document.getElementById('t-hemis-title').innerText = t.hemisTitle;
            document.getElementById('t-close').innerText = t.close;
            document.getElementById('t-hemis-domain-lbl').innerText = t.hemisDomainLbl;
            document.getElementById('t-hemis-login-lbl').innerText = t.hemisLoginLbl;
            document.getElementById('t-hemis-pass-lbl').innerText = t.hemisPassLbl;
            document.getElementById('hemisConnectBtn').innerText = t.hemisBtn;
            document.getElementById('t-read-start').innerText = t.readStart;
            document.getElementById('t-reading-now').innerText = t.readingNow;
            document.getElementById('t-next-btn').innerText = t.nextBtn;
            document.getElementById('t-timer-title').innerText = t.timerTitle;
            document.getElementById('activeSubject').innerText = timerRunning ? t.timerRunning : t.timerStopped;
            document.getElementById('startBtn').innerText = timerRunning ? t.pause : t.start;
            document.getElementById('t-add-title').innerText = t.addTitle;
            document.getElementById('lessonName').placeholder = t.subjectPlaceholder;
            document.getElementById('t-save-btn').innerText = t.saveBtn;

            renderTabs();
            renderLessons();
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('hemisPass');
            const eyeBtn = document.getElementById('eyeBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeBtn.innerText = '🙈';
            } else {
                passInput.type = 'password';
                eyeBtn.innerText = '👁️';
            }
        }

        function toggleHemisModal() {
            document.getElementById('hemisCard').classList.toggle('hidden');
        }

        async function connectHemis() {
            const t = translations[currentLang];
            let domain = document.getElementById('hemisDomain').value.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
            const login = document.getElementById('hemisLogin').value.trim();
            const password = document.getElementById('hemisPass').value.trim();
            const statusMsg = document.getElementById('hemisStatusMsg');
            const btn = document.getElementById('hemisConnectBtn');

            if (!domain || !login || !password) {
                statusMsg.innerText = t.hemisFillAll;
                statusMsg.classList.remove('hidden');
                return;
            }

            localStorage.setItem('hemis_domain', domain);
            localStorage.setItem('hemis_user', login);

            btn.innerText = t.hemisConnecting;
            btn.disabled = true;
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = t.hemisWait;

            try {
                const response = await fetch(`https://${domain}/rest/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: login, password: password })
                });

                const result = await response.json();

                if (response.ok && result.data && result.data.token) {
                    localStorage.setItem('hemis_token', result.data.token);
                    await fetchHemisSchedule(domain, result.data.token);
                } else {
                    statusMsg.innerText = t.hemisCorsErr;
                }
            } catch (error) {
                statusMsg.innerText = t.hemisCorsErr;
            } finally {
                btn.innerText = t.hemisBtn;
                btn.disabled = false;
            }
        }

        async function fetchHemisSchedule(domain, token) {
            try {
                const res = await fetch(`https://${domain}/rest/v1/education/schedule`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const json = await res.json();
                if (json.data && Array.isArray(json.data)) {
                    const newSchedule = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 0: [] };
                    json.data.forEach(item => {
                        const date = new Date(item.lesson_date * 1000);
                        const dayId = date.getDay();
                        const time = item.lessonPair ? item.lessonPair.start_time : "08:30";
                        const name = item.subject ? item.subject.name : "Fan";
                        if (!newSchedule[dayId].some(d => d.time === time && d.name === name)) {
                            newSchedule[dayId].push({ time, name, done: false });
                        }
                    });
                    weeklyData = newSchedule;
                    localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
                    renderLessons();
                    toggleHemisModal();
                }
            } catch (e) {}
        }

        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function initAudioEngine() {
            const t = translations[currentLang];
            audioActive = true;
            const btn = document.getElementById('audioStatusBtn');
            btn.innerText = "🔊";
            btn.className = "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-semibold px-2.5 py-1.5 rounded-full";
            speakText(t.voiceAudioOn);
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const cleanText = currentLang === 'uz' ? text.replace(/:/g, ' dan ').replace(/-/g, ' ') : text;
            const msg = new SpeechSynthesisUtterance(cleanText);
            
            msg.rate = 0.86; 
            msg.pitch = 1.04; 
            msg.volume = 1.0;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            
            let preferredVoice = null;
            if (currentLang === 'en') {
                preferredVoice = availableVoices.find(v => v.name.includes('Google') && v.lang.includes('en')) ||
                                 availableVoices.find(v => v.lang.includes('en'));
            } else if (currentLang === 'ru') {
                preferredVoice = availableVoices.find(v => v.name.includes('Google') && v.lang.includes('ru')) ||
                                 availableVoices.find(v => v.lang.includes('ru'));
            } else {
                preferredVoice = availableVoices.find(v => v.lang.includes('uz')) ||
                                 availableVoices.find(v => v.name.includes('Google') && v.lang.includes('tr')) ||
                                 availableVoices.find(v => v.name.includes('Google') && v.lang.includes('ru')) ||
                                 availableVoices.find(v => v.lang.includes('ru'));
            }

            if (preferredVoice) msg.voice = preferredVoice;
            window.speechSynthesis.speak(msg);
        }

        function renderTabs() {
            const t = translations[currentLang];
            const container = document.getElementById('daysTabs');
            container.innerHTML = '';
            t.days.forEach(day => {
                const btn = document.createElement('button');
                btn.onclick = () => { 
                    selectedDayId = day.id; 
                    stopReadingPanel();
                    renderTabs(); 
                    renderLessons(); 
                };
                btn.className = `flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition ${day.id === selectedDayId ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-900 text-slate-400 border border-slate-800'}`;
                btn.innerText = day.short;
                container.appendChild(btn);
            });
        }

        function renderLessons() {
            const t = translations[currentLang];
            const dayObj = t.days.find(d => d.id === selectedDayId);
            const lessons = weeklyData[selectedDayId] || [];
            document.getElementById('selectedDayTitle').innerText = `${dayObj.full} ${t.scheduleSuffix}`;
            document.getElementById('dayStats').innerText = `${lessons.length} ${t.lessonsCount}`;

            const container = document.getElementById('lessonsContainer');
            container.innerHTML = '';

            if (lessons.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-500 py-4">${t.noLessons}</p>`;
                return;
            }

            lessons.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `flex items-center justify-between p-3.5 rounded-2xl border ${item.done ? 'bg-slate-900/40 opacity-50' : 'bg-slate-900 border-slate-800'}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleDone(${index})">
                        <input type="checkbox" ${item.done ? 'checked' : ''} class="w-5 h-5 accent-emerald-500 rounded-md">
                        <div>
                            <span class="text-xs font-mono font-bold text-emerald-400">${item.time}</span>
                            <p class="text-sm font-semibold text-slate-100">${item.name}</p>
                        </div>
                    </div>
                    <button onclick="removeLesson(${index})" class="text-red-400 hover:text-red-300 p-2 text-xs">✕</button>
                `;
                container.appendChild(card);
            });
        }

        function startStepByStepReading() {
            const t = translations[currentLang];
            activeReadingList = weeklyData[selectedDayId] || [];
            if (activeReadingList.length === 0) {
                speakText(t.voiceNoLessons);
                return;
            }
            currentReadingIndex = 0;
            document.getElementById('readingControlPanel').classList.remove('hidden');
            readCurrentIndexLesson();
        }

        function readCurrentIndexLesson() {
            const t = translations[currentLang];
            if (currentReadingIndex < activeReadingList.length) {
                const lesson = activeReadingList[currentReadingIndex];
                const displayInfo = `#${currentReadingIndex + 1} | ${lesson.time} — ${lesson.name}`;
                const voiceInfo = t.voiceLessonRead(currentReadingIndex + 1, lesson.time, lesson.name);
                document.getElementById('currentReadingText').innerText = displayInfo;
                speakText(voiceInfo);
            } else {
                document.getElementById('currentReadingText').innerText = t.allRead;
                speakText(t.voiceAllDone);
                setTimeout(stopReadingPanel, 2500);
            }
        }

        function nextStepLesson() {
            currentReadingIndex++;
            readCurrentIndexLesson();
        }

        function stopReadingPanel() {
            document.getElementById('readingControlPanel').classList.add('hidden');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        document.getElementById('addLessonForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const t = translations[currentLang];
            const time = document.getElementById('lessonTime').value;
            const name = document.getElementById('lessonName').value.trim();
            if (!weeklyData[selectedDayId]) weeklyData[selectedDayId] = [];
            weeklyData[selectedDayId].push({ time, name, done: false });
            weeklyData[selectedDayId].sort((a, b) => a.time.localeCompare(b.time));
            localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
            renderLessons();
            e.target.reset();
            speakText(t.voiceSaved);
        });

        function toggleDone(index) {
            weeklyData[selectedDayId][index].done = !weeklyData[selectedDayId][index].done;
            localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
            renderLessons();
        }

        function removeLesson(index) {
            weeklyData[selectedDayId].splice(index, 1);
            localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
            renderLessons();
        }

        setInterval(() => {
            const t = translations[currentLang];
            const now = new Date();
            const currentDay = now.getDay();
            const currentHM = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const minuteKey = `${currentDay}-${currentHM}`;

            if (lastCheckedMinute !== minuteKey) {
                const todaysLessons = weeklyData[currentDay] || [];
                todaysLessons.forEach(lesson => {
                    if (lesson.time === currentHM && !lesson.done) {
                        lastCheckedMinute = minuteKey;
                        speakText(t.voiceAlert(lesson.time, lesson.name));
                    }
                });
            }
        }, 1000);

        let targetEndTime = 0;
        let timerRunning = false;
        let timerInterval = null;

        function setTimer(mins) {
            const t = translations[currentLang];
            clearInterval(timerInterval);
            timerRunning = false;
            targetEndTime = Date.now() + mins * 60 * 1000;
            updateTimerView(mins * 60);
            document.getElementById('startBtn').innerText = t.start;
            document.getElementById('activeSubject').innerText = t.timerStopped;
        }

        function toggleTimer() {
            const t = translations[currentLang];
            if (timerRunning) {
                clearInterval(timerInterval);
                timerRunning = false;
                document.getElementById('startBtn').innerText = t.resume;
                document.getElementById('activeSubject').innerText = t.timerStopped;
            } else {
                if (!targetEndTime) targetEndTime = Date.now() + 25 * 60 * 1000;
                timerRunning = true;
                document.getElementById('startBtn').innerText = t.pause;
                document.getElementById('activeSubject').innerText = t.timerRunning;
                speakTest(t.voiceTimerStart);
                
                timerInterval = setInterval(() => {
                    const remainingSec = Math.round((targetEndTime - Date.now()) / 1000);
                    if (remainingSec > 0) {
                        updateTimerView(remainingSec);
                    } else {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        updateTimerView(0);
                        document.getElementById('startBtn').innerText = t.start;
                        document.getElementById('activeSubject').innerText = t.timerStopped;
                        speakText(t.voiceTimerEnd);
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            const t = translations[currentLang];
            clearInterval(timerInterval);
            timerRunning = false;
            targetEndTime = Date.now() + 25 * 60 * 1000;
            updateTimerView(25 * 60);
            document.getElementById('startBtn').innerText = t.start;
            document.getElementById('activeSubject').innerText = t.timerStopped;
        }

        function updateTimerView(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }

        applyLanguage();
    </script>
</body>
</html>

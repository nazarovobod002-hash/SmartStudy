<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>SmartStudy - Interaktiv Ovozli Dars Jadvali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-10 font-sans select-none">

    <!-- Yuqori panel -->
    <header class="bg-slate-900/90 backdrop-blur-md sticky top-0 z-20 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                SmartStudy
            </h1>
            <p id="todayInfo" class="text-[11px] text-slate-400">Yuklanmoqda...</p>
        </div>
        <button onclick="initAudioEngine()" id="audioStatusBtn" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-semibold px-3 py-1.5 rounded-full active:scale-95 transition">
            🔇 Ovozni yoqish
        </button>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

        <!-- Hafta kunlari tablari -->
        <div class="flex gap-2 overflow-x-auto py-1" id="daysTabs"></div>

        <!-- Ovozli o'qish va Bittalab o'tish paneli -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-2xl p-4 shadow-lg space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <h2 id="selectedDayTitle" class="text-lg font-bold text-white">Jadval</h2>
                    <p id="dayStats" class="text-xs text-emerald-100">0 ta dars</p>
                </div>
                <button onclick="startStepByStepReading()" class="bg-white text-emerald-800 font-bold text-xs px-4 py-3 rounded-xl shadow active:scale-95 transition">
                    🔊 Boshidan o'qish
                </button>
            </div>
            
            <!-- Keyingisi tugmasi chiqadigan qism -->
            <div id="readingControlPanel" class="hidden bg-emerald-900/60 border border-emerald-400/40 rounded-xl p-3 flex items-center justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-emerald-200 block">Hozir o'qilmoqda:</span>
                    <p id="currentReadingText" class="text-xs font-semibold text-white">Tayyorlanmoqda...</p>
                </div>
                <button onclick="nextStepLesson()" class="bg-amber-400 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-lg shadow active:scale-95 transition">
                    Keyingisi ➡️
                </button>
            </div>
        </div>

        <!-- Pomodoro Taymer -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-blue-400">⏱ Real vaqt taymeri</span>
                <div class="flex gap-1.5">
                    <button onclick="setTimer(25)" class="text-[11px] bg-slate-800 px-2.5 py-1 rounded-md text-slate-300">25m</button>
                    <button onclick="setTimer(5)" class="text-[11px] bg-slate-800 px-2.5 py-1 rounded-md text-slate-300">5m</button>
                </div>
            </div>
            <div class="flex items-center justify-between mt-3">
                <div>
                    <div id="timerDisplay" class="text-4xl font-mono font-bold text-white tracking-wider">25:00</div>
                    <p id="activeSubject" class="text-[11px] text-slate-400">Taymer to'xtatilgan</p>
                </div>
                <div class="flex gap-2">
                    <button id="startBtn" onclick="toggleTimer()" class="bg-blue-600 text-white font-bold text-sm px-5 py-3 rounded-xl">Boshlash</button>
                    <button onclick="resetTimer()" class="bg-slate-800 text-slate-300 text-sm px-3.5 py-3 rounded-xl">↺</button>
                </div>
            </div>
        </div>

        <!-- Dars qo'shish -->
        <form id="addLessonForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <p class="text-xs font-bold text-slate-300 uppercase">+ Dars qo'shish</p>
            <div class="grid grid-cols-3 gap-2">
                <input type="time" id="lessonTime" required class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                <input type="text" id="lessonName" required placeholder="Fan nomi..." class="col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <button type="submit" class="w-full bg-slate-800 text-emerald-400 font-bold py-2.5 rounded-xl text-sm border border-slate-700">Saqlash</button>
        </form>

        <!-- Darslar ro'yxati -->
        <div class="space-y-2.5" id="lessonsContainer"></div>

    </main>

    <script>
        const daysOfWeek = [
            { id: 1, short: "Dush", full: "Dushanba" },
            { id: 2, short: "Sesh", full: "Seshanba" },
            { id: 3, short: "Chor", full: "Chorshanba" },
            { id: 4, short: "Pay", full: "Payshanba" },
            { id: 5, short: "Jum", full: "Juma" },
            { id: 6, short: "Shan", full: "Shanba" },
            { id: 0, short: "Yak", full: "Yakshanba" }
        ];

        const todayObj = new Date();
        const realTodayId = todayObj.getDay();
        let selectedDayId = realTodayId;
        let audioActive = false;
        let lastCheckedMinute = "";

        // Bittalab o'qish uchun o'zgaruvchilar
        let currentReadingIndex = 0;
        let activeReadingList = [];

        let weeklyData = JSON.parse(localStorage.getItem('offlineStudyData')) || {
            1: [{ time: "08:30", name: "Oliy matematika", done: false }],
            2: [], 3: [], 4: [], 5: [], 6: [], 0: []
        };

        document.getElementById('todayInfo').innerText = `Bugun: ${daysOfWeek.find(d => d.id === realTodayId).full}`;

        function initAudioEngine() {
            audioActive = true;
            const btn = document.getElementById('audioStatusBtn');
            btn.innerText = "🔊 Ovoz faol";
            btn.className = "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-semibold px-3 py-1.5 rounded-full";
            speakText("Ovozli eslatma muvaffaqiyatli faollashtirildi.");
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 0.95;
            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.lang.includes('uz') || v.lang.includes('ru'));
            if (voice) msg.voice = voice;
            window.speechSynthesis.speak(msg);
        }

        function renderTabs() {
            const container = document.getElementById('daysTabs');
            container.innerHTML = '';
            daysOfWeek.forEach(day => {
                const btn = document.createElement('button');
                btn.onclick = () => { 
                    selectedDayId = day.id; 
                    stopReadingPanel();
                    renderTabs(); 
                    renderLessons(); 
                };
                btn.className = `flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition ${day.id === selectedDayId ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'}`;
                btn.innerText = day.short;
                container.appendChild(btn);
            });
        }

        function renderLessons() {
            const dayObj = daysOfWeek.find(d => d.id === selectedDayId);
            const lessons = weeklyData[selectedDayId] || [];
            document.getElementById('selectedDayTitle').innerText = `${dayObj.full} jadvali`;
            document.getElementById('dayStats').innerText = `${lessons.length} ta dars`;

            const container = document.getElementById('lessonsContainer');
            container.innerHTML = '';

            lessons.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `flex items-center justify-between p-3.5 rounded-2xl border ${item.done ? 'bg-slate-900/40 opacity-50' : 'bg-slate-900 border-slate-800'}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 flex-1" onclick="toggleDone(${index})">
                        <input type="checkbox" ${item.done ? 'checked' : ''} class="w-5 h-5 accent-emerald-500 rounded-md">
                        <div>
                            <span class="text-xs font-mono font-bold text-emerald-400">${item.time}</span>
                            <p class="text-sm font-semibold text-slate-100">${item.name}</p>
                        </div>
                    </div>
                    <button onclick="removeLesson(${index})" class="text-red-400 p-2 text-xs">✕</button>
                `;
                container.appendChild(card);
            });
        }

        // --- BITTALAB O'QISH VA "KEYINGISI" Mantiqi ---
        function startStepByStepReading() {
            activeReadingList = weeklyData[selectedDayId] || [];
            if (activeReadingList.length === 0) {
                speakText("Bu kunda darslar mavjud emas.");
                return;
            }
            currentReadingIndex = 0;
            document.getElementById('readingControlPanel').classList.remove('hidden');
            readCurrentIndexLesson();
        }

        function readCurrentIndexLesson() {
            if (currentReadingIndex < activeReadingList.length) {
                const lesson = activeReadingList[currentReadingIndex];
                const info = `${currentReadingIndex + 1}-dars. Soat ${lesson.time} da, ${lesson.name}`;
                document.getElementById('currentReadingText').innerText = info;
                speakText(info);
            } else {
                document.getElementById('currentReadingText').innerText = "Barcha darslar o'qib bo'lindi!";
                speakText("Kunlik barcha darslar tugadi.");
                setTimeout(stopReadingPanel, 3000);
            }
        }

        function nextStepLesson() {
            currentReadingIndex++;
            readCurrentIndexLesson();
        }

        function stopReadingPanel() {
            document.getElementById('readingControlPanel').classList.add('hidden');
            window.speechSynthesis.cancel();
        }

        document.getElementById('addLessonForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const time = document.getElementById('lessonTime').value;
            const name = document.getElementById('lessonName').value.trim();
            if (!weeklyData[selectedDayId]) weeklyData[selectedDayId] = [];
            weeklyData[selectedDayId].push({ time, name, done: false });
            weeklyData[selectedDayId].sort((a, b) => a.time.localeCompare(b.time));
            localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
            renderLessons();
            e.target.reset();
            speakText("Dars saqlandi.");
        });

        function toggleDone(index) {
            weeklyData[selectedDayId][index].done = !weeklyData[selectedDayId][index].done;
            localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
            renderLessons();
        }

        function removeLesson(index) {
            weeklyData[selectedDayId].splice(index, 1);
            localStorage.setItem('offlineStudyData', JSON.stringify(weeklyData));
            renderLessons();
        }

        // Real vaqt fon tekshiruvi
        setInterval(() => {
            const now = new Date();
            const currentDay = now.getDay();
            const currentHM = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const minuteKey = `${currentDay}-${currentHM}`;

            if (lastCheckedMinute !== minuteKey) {
                const todaysLessons = weeklyData[currentDay] || [];
                todaysLessons.forEach(lesson => {
                    if (lesson.time === currentHM && !lesson.done) {
                        lastCheckedMinute = minuteKey;
                        speakText(`Diqqat! Soat ${lesson.time} bo'ldi. ${lesson.name} darsini boshlash vaqti keldi!`);
                    }
                });
            }
        }, 1000);

        // Pomodoro Taymer
        let targetEndTime = 0;
        let timerRunning = false;
        let timerInterval = null;

        function setTimer(mins) {
            clearInterval(timerInterval);
            timerRunning = false;
            targetEndTime = Date.now() + mins * 60 * 1000;
            updateTimerView(mins * 60);
            document.getElementById('startBtn').innerText = "Boshlash";
        }

        function toggleTimer() {
            if (timerRunning) {
                clearInterval(timerInterval);
                timerRunning = false;
                document.getElementById('startBtn').innerText = "Davom etish";
            } else {
                if (!targetEndTime) targetEndTime = Date.now() + 25 * 60 * 1000;
                timerRunning = true;
                document.getElementById('startBtn').innerText = "Pauza";
                speakText("Taymer boshlandi.");
                
                timerInterval = setInterval(() => {
                    const remainingSec = Math.round((targetEndTime - Date.now()) / 1000);
                    if (remainingSec > 0) {
                        updateTimerView(remainingSec);
                    } else {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        updateTimerView(0);
                        document.getElementById('startBtn').innerText = "Boshlash";
                        speakText("Vaqt tugadi!");
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            targetEndTime = Date.now() + 25 * 60 * 1000;
            updateTimerView(25 * 60);
            document.getElementById('startBtn').innerText = "Boshlash";
        }

        function updateTimerView(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }

        renderTabs();
        renderLessons();
    </script>
</body>
</html>

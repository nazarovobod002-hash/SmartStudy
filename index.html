    <script>
        // Sonlarni so'zga o'giruvchi funksiyalar (100% o'zbekcha talaffuz uchun)
        function uzbekNumberToWords(num) {
            num = parseInt(num, 10);
            if (isNaN(num) || num === 0) return "nol";
            const ones = ["", "bir", "ikki", "uch", "to'rt", "besh", "olti", "yetti", "sakkiz", "to'qqiz"];
            const tens = ["", "o'n", "yigirma", "o'ttiz", "qirq", "ellik"];
            if (num < 10) return ones[num];
            const t = Math.floor(num / 10);
            const o = num % 10;
            return (tens[t] + (o > 0 ? " " + ones[o] : "")).trim();
        }

        function uzbekOrdinal(num) {
            const ordinals = ["", "birinchi", "ikkinchi", "uchinchi", "to'rtinchi", "beshinchi", "oltinchi", "yettinchi", "sakkizinchi", "to'qqizinchi", "o'ninchi", "o'n birinchi", "o'n ikkinchi"];
            if (ordinals[num]) return ordinals[num];
            const words = uzbekNumberToWords(num);
            return words + (/[aeiou]$/.test(words) ? "nchi" : "inchi");
        }

        // Xavfsiz localStorage (private rejim yoki buzilgan ma'lumotda ilova yiqilmasligi uchun)
        function lsGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function lsSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function formatUzbekTimeSpeech(timeStr) {
            const [hStr, mStr] = timeStr.split(':');
            const h = parseInt(hStr, 10);
            const m = parseInt(mStr, 10);
            const hWord = uzbekNumberToWords(h);
            if (m === 0) {
                return `soat ${hWord} nol nol da`;
            }
            const mWord = uzbekNumberToWords(m);
            return `soat ${hWord} dan ${mWord} daqiqa o'tganda`;
        }

                if (!data || typeof data !== 'object') return fallback;
                [0, 1, 2, 3, 4, 5, 6].forEach(k => { if (!Array.isArray(data[k])) data[k] = []; });

                    lsSet(weekKeyName, weekKey);
                    lsSet(getStorageKey(), JSON.stringify(data));
                }
                return data;
            } catch (e) {

        async function connectHemis() {
            const t = translations[currentLang];
            let domain = document.getElementById('hemisDomain').value.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
            const login = document.getElementById('hemisLogin').value.trim();
            const password = document.getElementById('hemisPass').value.trim();
            const statusMsg = document.getElementById('hemisStatusMsg');
            const btn = document.getElementById('hemisConnectBtn');

            if (!domain || !login || !password) {
                statusMsg.innerText = t.hemisFillAll;
                statusMsg.classList.remove('hidden');
                return;
            }

            lsSet('hemis_domain', domain);
            lsSet('hemis_user', login);

            btn.innerText = t.hemisConnecting;
            btn.disabled = true;
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = t.hemisWait;

            try {
                const response = await fetch(`https://${domain}/rest/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: login, password: password })
                });

                let result = null;
                try { result = await response.json(); } catch (e) {}

                if (response.ok && result && result.data && result.data.token) {
                    const loaded = await fetchHemisSchedule(domain, result.data.token);
                    if (loaded) {
                        statusMsg.classList.add('hidden');
                    } else {
                        statusMsg.innerText = t.hemisScheduleErr;
                    }
                } else {
                    statusMsg.innerText = t.hemisAuthErr;
                }
            } catch (error) {
                // fetch o'zi yiqilsa — tarmoq yoki CORS cheklovi
                statusMsg.innerText = t.hemisCorsErr;
            } finally {
                btn.innerText = t.hemisBtn;
                btn.disabled = false;
            }
        }

        async function fetchHemisSchedule(domain, token) {
            try {
                const res = await fetch(`https://${domain}/rest/v1/education/schedule`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) return false;
                const json = await res.json();
                if (json.data && Array.isArray(json.data)) {
                    const newSchedule = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 0: [] };
                    json.data.forEach(item => {
                        const date = new Date(item.lesson_date * 1000);
                        const dayId = date.getDay();
                        const time = item.lessonPair ? item.lessonPair.start_time : "08:30";
                        const name = item.subject ? item.subject.name : "Fan";
                        if (!newSchedule[dayId].some(d => d.time === time && d.name === name)) {
                            newSchedule[dayId].push({ time, name, done: false });
                        }
                    });
                    [0, 1, 2, 3, 4, 5, 6].forEach(k => newSchedule[k].sort((a, b) => a.time.localeCompare(b.time)));
                    weeklyData = newSchedule;
                    saveWeekly();
                    renderLessons();
                    toggleHemisModal();
                    return true;
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();

        // Ovoz sozlamalari (tanlangan ovoz, tezlik, ohang) — saqlanib qoladi
        let voiceSettings = { voice: '', rate: 0.85, pitch: 1.0 };
        try {
            const savedVoice = JSON.parse(lsGet('smartstudy_voice') || 'null');
            if (savedVoice && typeof savedVoice === 'object') {
                if (typeof savedVoice.voice === 'string') voiceSettings.voice = savedVoice.voice;
                if (isFinite(savedVoice.rate)) voiceSettings.rate = Math.min(1.3, Math.max(0.5, savedVoice.rate));
                if (isFinite(savedVoice.pitch)) voiceSettings.pitch = Math.min(1.3, Math.max(0.7, savedVoice.pitch));
            }
        } catch (e) {}

        function renderVoiceOptions() {
            const select = document.getElementById('voiceSelect');
            if (!select) return;
            const t = translations[currentLang];
            const prefixes = currentLang === 'uz' ? ['uz', 'tr', 'ru'] : [currentLang];
            const rank = v => {
                const i = prefixes.findIndex(p => v.lang.toLowerCase().startsWith(p));
                return i === -1 ? 99 : i;
            };
            const sorted = [...availableVoices].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
            select.innerHTML = '';
            const auto = document.createElement('option');
            auto.value = '';
            auto.textContent = t.voiceAuto;
            select.appendChild(auto);
            sorted.forEach(v => {
                const o = document.createElement('option');
                o.value = v.name;
                o.textContent = `${v.name} (${v.lang})`;
                select.appendChild(o);
            });
            select.value = sorted.some(v => v.name === voiceSettings.voice) ? voiceSettings.voice : '';
            document.getElementById('voiceRate').value = voiceSettings.rate;
            document.getElementById('voicePitch').value = voiceSettings.pitch;
        }

        function onVoiceSettingChange() {
            voiceSettings.voice = document.getElementById('voiceSelect').value;

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = voiceSettings.rate;
            msg.pitch = voiceSettings.pitch;
            msg.volume = 1.0;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            
            let preferredVoice = null;
            if (currentLang === 'en') {
                preferredVoice = availableVoices.find(v => v.name.includes('Google') && v.lang.includes('en')) ||
                                 availableVoices.find(v => v.lang.includes('en'));
            } else if (currentLang === 'ru') {
                preferredVoice = availableVoices.find(v => v.name.includes('Google') && v.lang.includes('ru')) ||
                                 availableVoices.find(v => v.lang.includes('ru'));
            } else {
                preferredVoice = availableVoices.find(v => v.lang.includes('uz')) ||
                                 availableVoices.find(v => v.name.includes('Google') && v.lang.includes('uz')) ||
                                 availableVoices.find(v => v.name.includes('Google') && v.lang.includes('tr')) ||
                                 availableVoices.find(v => v.lang.includes('ru'));
            }

            // Foydalanuvchi qo'lda tanlagan ovoz avtomatik tanlovdan ustun turadi
            const chosenVoice = voiceSettings.voice && availableVoices.find(v => v.name === voiceSettings.voice);
            if (chosenVoice) {
                msg.voice = chosenVoice;
                msg.lang = chosenVoice.lang;
            } else if (preferredVoice) {
                msg.voice = preferredVoice;
            }
            window.speechSynthesis.speak(msg);
        }

                `;
                container.appendChild(card);
            });
        }

        function startStepByStepReading() {
            const t = translations[currentLang];
            activeReadingList = weeklyData[selectedDayId] || [];
            if (activeReadingList.length === 0) {
                speakText(t.voiceNoLessons);
                return;
            }
            currentReadingIndex = 0;
            document.getElementById('readingControlPanel').classList.remove('hidden');
            readCurrentIndexLesson();
        }

        function readCurrentIndexLesson() {
            const t = translations[currentLang];
            const rLang = t.roles[currentRole];
            if (currentReadingIndex < activeReadingList.length) {
                const lesson = activeReadingList[currentReadingIndex];
                const displayInfo = `#${currentReadingIndex + 1} | ${lesson.time} — ${lesson.name}`;
                const voiceInfo = t.voiceLessonRead(currentReadingIndex + 1, lesson.time, lesson.name, rLang.itemWord);
                document.getElementById('currentReadingText').innerText = displayInfo;
                speakText(voiceInfo);
            } else {
                document.getElementById('currentReadingText').innerText = t.allRead;
                speakText(t.voiceAllDone);
                setTimeout(stopReadingPanel, 2500);
            }
        }

        function nextStepLesson() {
            currentReadingIndex++;
            readCurrentIndexLesson();
        }

        function stopReadingPanel() {
            document.getElementById('readingControlPanel').classList.add('hidden');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        document.getElementById('addLessonForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const t = translations[currentLang];
            const time = document.getElementById('lessonTime').value;
            const name = document.getElementById('lessonName').value.trim();
            if (!time || !name) return;
            if (!weeklyData[selectedDayId]) weeklyData[selectedDayId] = [];
            weeklyData[selectedDayId].push({ time, name, done: false });
            weeklyData[selectedDayId].sort((a, b) => a.time.localeCompare(b.time));
            saveWeekly();
            renderLessons();
            e.target.reset();
            speakText(t.voiceSaved);
        });

        function toggleDone(index) {
            weeklyData[selectedDayId][index].done = !weeklyData[selectedDayId][index].done;
            saveWeekly();
            renderLessons();
        }

        function removeLesson(index) {
            weeklyData[selectedDayId].splice(index, 1);
            saveWeekly();
            renderLessons();
        }

        // Taymer va real vaqtni boshqarish funksiyalari
        function startCustomTimer(mins) {
            clearInterval(timerInterval);
            timerModeActive = true;
            pausedRemainingSec = 0;
            targetEndTime = Date.now() + mins * 60 * 1000;
            updateTimerCountdownView(mins * 60);
            const t = translations[currentLang];
            document.getElementById('startBtn').innerText = t.pause;
            document.getElementById('activeSubject').innerText = t.timerRunning;
            speakText(t.voiceTimerStart);
            runCountdownInterval();
        }

        function toggleTimer() {
            const t = translations[currentLang];
            if (timerModeActive) {
                // Pauza qilish (qolgan vaqt saqlanadi)
                clearInterval(timerInterval);
                pausedRemainingSec = Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000));
                timerModeActive = false;
                document.getElementById('startBtn').innerText = t.resume;
                document.getElementById('activeSubject').innerText = t.timerStopped;
            } else {
                // Davom etish yoki yangidan boshlash
                const defaultM = roleConfigs[currentRole].defaultMins;
                const remaining = pausedRemainingSec > 0 ? pausedRemainingSec : defaultM * 60;
                targetEndTime = Date.now() + remaining * 1000;
                pausedRemainingSec = 0;
                timerModeActive = true;
                updateTimerCountdownView(remaining);
                document.getElementById('startBtn').innerText = t.pause;
                document.getElementById('activeSubject').innerText = t.timerRunning;
                speakText(t.voiceTimerStart);
                runCountdownInterval();
            }
        }

        function runCountdownInterval() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const remainingSec = Math.round((targetEndTime - Date.now()) / 1000);
                if (remainingSec > 0) {
                    updateTimerCountdownView(remainingSec);
                } else {
                    clearInterval(timerInterval);
                    timerModeActive = false;
                    pausedRemainingSec = 0;
                    updateTimerCountdownView(0);
                    const t = translations[currentLang];
                    document.getElementById('startBtn').innerText = t.start;
                    document.getElementById('activeSubject').innerText = t.timerStopped;
                    speakText(t.voiceTimerEnd);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerModeActive = false;
            pausedRemainingSec = 0;
            targetEndTime = 0;
            updateLiveClockAndCalendar();
        }

        function updateTimerCountdownView(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }

        // Asosiy har sekundlik va minutlik sikl (Real vaqt soati va Dars eslatmasi)
        setInterval(() => {
            const now = new Date();
            
            // 1. Agar taymer ishlamayotgan bo'lsa, ekran doimo jonli soatni ko'rsatadi
            if (!timerModeActive) {
                const hh = now.getHours().toString().padStart(2, '0');
                const mm = now.getMinutes().toString().padStart(2, '0');
                const ss = now.getSeconds().toString().padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${hh}:${mm}:${ss}`;
            }

            // 2. Har minutda dars vaqtini tekshirib, o'zbekcha ovozda eslatish
            const currentDay = now.getDay();
            const currentHM = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const minuteKey = `${currentRole}-${currentDay}-${currentHM}`;

            if (lastCheckedMinute !== minuteKey && audioActive) {
                const dueLessons = (weeklyData[currentDay] || []).filter(l => l.time === currentHM && !l.done);
                if (dueLessons.length > 0) {
                    lastCheckedMinute = minuteKey;
                    const t = translations[currentLang];
                    const rLang = t.roles[currentRole];
                    // Bir daqiqada bir nechta dars bo'lsa, hammasi bitta nutqda aytiladi
                    speakText(dueLessons.map(l => t.voiceAlert(l.time, l.name, rLang.itemWord)).join(' '));
                }
            }
        }, 1000);

        // Har soatda kalendarni yangilab turish uchun
        setInterval(updateLiveClockAndCalendar, 60000);

        // Boshlang'ich yuklash
        applyUI();
    </script>
</body>
</html>
